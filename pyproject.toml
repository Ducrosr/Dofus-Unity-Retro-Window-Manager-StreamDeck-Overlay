[project]
name = "dofus-window-manager"
version = "2.20.0"
description = "Gestionnaire local de fenêtres Dofus Unity et Retro pour Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10.0,<13",
  "pystray>=0.19,<1",
]

[project.optional-dependencies]
popup = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "windows-capture>=1.5.0,<2",
]
dev = [
  "pyinstaller>=6.19,<7",
  "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
