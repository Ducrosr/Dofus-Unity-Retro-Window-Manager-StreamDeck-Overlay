name: Compiler et publier une version

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
    paths:
      - "dwm/__init__.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à republier, par exemple v2.20.0-beta.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publication-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Tester et compiler sous Windows
    runs-on: windows-latest
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json

      - name: Contrôler le tag et les versions
        id: metadata
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $env:MANUAL_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            python -c "import dwm; print(dwm.__release_tag__)"
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Tag invalide : $tag"
          }
          $tagVersion = $Matches.version

          $projectVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($tagVersion -ne $projectVersion) {
            throw "Le tag $tag ne correspond pas à la version $projectVersion de pyproject.toml."
          }

          $targetSha = (git rev-parse HEAD).Trim()
          $existingTag = git tag --list $tag
          if ($existingTag -eq $tag) {
            $tagSha = (git rev-parse "$tag^{commit}").Trim()
            if ($targetSha -ne $tagSha) {
              throw "Le code récupéré ($targetSha) ne correspond pas au tag $tag ($tagSha)."
            }
          } elseif ($env:GITHUB_EVENT_NAME -ne "push" -or $env:GITHUB_REF_TYPE -ne "branch") {
            throw "Le tag $tag n'existe pas pour cette republication manuelle."
          }

          $packageVersion = node -p "require('./streamdeck-plugin/package.json').version"
          $manifestVersion = node -p "require('./streamdeck-plugin/com.remyducros.dofuswindowmanager.sdPlugin/manifest.json').Version"
          if ($manifestVersion -ne "$packageVersion.0") {
            throw "Versions Stream Deck incohérentes : package $packageVersion, manifeste $manifestVersion."
          }

          $prerelease = ($tag.Contains("-")).ToString().ToLowerInvariant()

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "target_sha=$targetSha" >> $env:GITHUB_OUTPUT

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Exécuter les tests Python
        run: python -m unittest discover -s tests -v

      - name: Contrôler le code Python
        run: python -m ruff check .

      - name: Installer les dépendances Stream Deck
        working-directory: streamdeck-plugin
        run: npm ci

      - name: Tester le plugin Stream Deck
        working-directory: streamdeck-plugin
        run: npm test

      - name: Contrôler TypeScript
        working-directory: streamdeck-plugin
        run: npm run typecheck

      - name: Compiler et valider le plugin
        working-directory: streamdeck-plugin
        run: npm run build:profiles && npm run build && npm run validate && npm run pack

      - name: Compiler l'exécutable Windows
        run: python build_exe.py

      - name: Signer l'exécutable si un certificat est configuré
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./installer/sign_windows.ps1 -FilePath "dist/DofusWindowManager.exe"

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Préparer l'exécutable pour l'installateur
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item "dist/DofusWindowManager.exe" "release-assets/DofusWindowManager.exe"

      - name: Compiler l'installateur Windows
        shell: pwsh
        run: ./installer/build_installer.ps1 -AppVersion "${{ steps.metadata.outputs.version }}"

      - name: Signer l'installateur si un certificat est configuré
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./installer/sign_windows.ps1 -FilePath "release-assets/DofusWindowManager-Setup.exe"

      - name: Préparer et vérifier les fichiers
        shell: pwsh
        run: |
          $output = "release-assets"
          New-Item -ItemType Directory -Force $output | Out-Null
          $exe = "dist/DofusWindowManager.exe"
          $pluginSource = "streamdeck-plugin/com.remyducros.dofuswindowmanager.streamDeckPlugin"
          $pluginTarget = "$output/DofusWindowManager-StreamDeck.streamDeckPlugin"
          $installer = "$output/DofusWindowManager-Setup.exe"

          Copy-Item $exe "$output/DofusWindowManager.exe"
          Copy-Item $pluginSource $pluginTarget

          $exeBytes = [System.IO.File]::ReadAllBytes("$output/DofusWindowManager.exe")
          if ($exeBytes.Length -lt 2 -or $exeBytes[0] -ne 0x4D -or $exeBytes[1] -ne 0x5A) {
            throw "L'exécutable produit n'est pas un fichier PE Windows valide."
          }

          $exeHash = (Get-FileHash "$output/DofusWindowManager.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pluginHash = (Get-FileHash $pluginTarget -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  DofusWindowManager.exe" | Set-Content "$output/DofusWindowManager.exe.sha256" -Encoding ascii
          "$pluginHash  DofusWindowManager-StreamDeck.streamDeckPlugin" | Set-Content "$output/DofusWindowManager-StreamDeck.streamDeckPlugin.sha256" -Encoding ascii
          "$installerHash  DofusWindowManager-Setup.exe" | Set-Content "$output/DofusWindowManager-Setup.exe.sha256" -Encoding ascii
          @(
            "$exeHash  DofusWindowManager.exe"
            "$pluginHash  DofusWindowManager-StreamDeck.streamDeckPlugin"
            "$installerHash  DofusWindowManager-Setup.exe"
          ) | Set-Content "$output/SHA256SUMS.txt" -Encoding ascii

          Get-ChildItem $output | Format-Table Name, Length

      - name: Conserver les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Créer la GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les fichiers compilés
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Créer ou actualiser la Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 7 ]]; then
            echo "Sept fichiers de publication étaient attendus, ${#assets[@]} ont été trouvés." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            release_args=(
              "$RELEASE_TAG"
              "${assets[@]}"
              --repo "$GITHUB_REPOSITORY"
              --target "$TARGET_SHA"
              --title "Dofus Window Manager ${RELEASE_TAG#v}"
              --generate-notes
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
